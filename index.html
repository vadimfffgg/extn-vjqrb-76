<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Мойка Авто — Дневник</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080808;
            --surface: #0f0f0f;
            --border: #1f1f1f;
            --text: #e0e0e0;
            --text-secondary: #8a8a8a;
            --accent: #f47920;
            --accent-glow: rgba(244, 121, 32, 0.3);
            --radius: 18px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --danger: #d84b4b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem 4rem;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 2.2rem;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideOutRight {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(60px); }
        }
        .anim-fade-up {
            animation: fadeUp 0.5s ease forwards;
        }
        .anim-scale-in {
            animation: scaleIn 0.35s ease forwards;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid var(--border);
        }
        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 2px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #1f1f1f;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .avatar:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent-glow);
        }
        .car-name {
            font-size: 1.7rem;
            font-weight: 700;
            color: #fff;
        }
        .car-name .model {
            color: var(--accent);
        }
        .car-details {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.2rem;
        }

        .account-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: center;
        }
        .account-chip {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--surface);
            border: 1px solid #222;
            border-radius: 40px;
            padding: 0.35rem 1rem 0.35rem 0.4rem;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            font-size: 0.85rem;
            position: relative;
        }
        .account-chip.active {
            border-color: var(--accent);
            background: #1a1a1a;
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .chip-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chip-delete {
            margin-left: 0.2rem;
            color: #666;
            font-weight: bold;
            cursor: pointer;
            padding: 0 0.3rem;
            border-radius: 50%;
            transition: var(--transition);
            font-size: 0.9rem;
            line-height: 1;
        }
        .chip-delete:hover {
            color: var(--danger);
            background: rgba(216,75,75,0.15);
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .card {
            background: var(--surface);
            border: 1px solid #1a1a1a;
            border-radius: var(--radius);
            padding: 1.2rem;
            transition: var(--transition);
            animation: fadeUp 0.4s ease forwards;
            opacity: 0;
        }
        .card.removing {
            animation: slideOutRight 0.3s ease forwards;
        }
        .card-photo {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            margin: 0.8rem 0;
            background: #1a1a1a;
            background-size: cover;
            background-position: center;
            border: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
        }
        .notes {
            font-size: 0.9rem;
            color: #aaa;
            background: #111;
            padding: 0.7rem 1rem;
            border-radius: 10px;
            border-left: 3px solid var(--accent);
        }
        .delete-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            padding: 0.3rem 0.6rem;
            border-radius: 20px;
            transition: var(--transition);
        }
        .delete-btn:hover {
            color: #e05555;
            background: #1a1111;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 1rem;
            background: var(--surface);
            border: 1px solid #1c1c1c;
            border-radius: var(--radius);
            padding: 1.5rem;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
        }

        .btn {
            background: #141414;
            border: 1px solid #2a2a2a;
            color: #ccc;
            padding: 0.7rem 1.5rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }
        .btn.danger {
            border-color: #5a2a2a;
            color: #d84b4b;
            background: #1a1111;
        }
        .btn.danger:hover {
            background: #2a1515;
            border-color: var(--danger);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 24px;
            padding: 2rem;
            width: 90%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: scaleIn 0.3s ease;
        }
        input, textarea {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 0.8rem;
            color: #fff;
            font-family: inherit;
            width: 100%;
        }
        .footer {
            text-align: center;
            color: #444;
            font-size: 0.8rem;
            margin-top: 2rem;
            border-top: 1px solid #1a1a1a;
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>
<div class="app" id="app"></div>
<div class="modal" id="modal"><div class="modal-content" id="modalContent"></div></div>

<script>
    (() => {
        const STORAGE_KEY = 'carwash_multi_profile_v3';
        let state = {
            profiles: [],
            activeProfileId: null,
            washes: {}
        };

        function loadState() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    state.profiles = parsed.profiles || [];
                    state.activeProfileId = parsed.activeProfileId || (state.profiles[0]?.id || null);
                    state.washes = parsed.washes || {};
                } catch (e) { setDemoData(); }
            } else {
                setDemoData();
            }
            if (!state.profiles.length) setDemoData();
            if (!state.profiles.find(p => p.id === state.activeProfileId)) {
                state.activeProfileId = state.profiles[0]?.id || null;
            }
        }

        function setDemoData() {
            const id1 = 'bmw_m4_demo';
            const id2 = 'porsche_demo';
            state.profiles = [
                { id: id1, brand: 'BMW', model: 'M4 Competition', year: 2024, avatar: '', mileage: 48320 },
                { id: id2, brand: 'Porsche', model: '911 Carrera', year: 2023, avatar: '', mileage: 32100 }
            ];
            state.activeProfileId = id1;
            state.washes = {
                [id1]: [
                    { id: 101, date: '2026-07-26', mileage: 48320, photo: '', notes: 'Двухфазная мойка, Gyeon Bathe, воск Soft99.', duration: 50 },
                    { id: 102, date: '2026-07-10', mileage: 47890, photo: '', notes: 'Бесконтактная мойка Koch Chemie.', duration: 40 },
                ],
                [id2]: [
                    { id: 201, date: '2026-07-20', mileage: 32100, photo: '', notes: 'Ручная мойка с воском Porsche.', duration: 35 },
                ]
            };
            saveState();
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function getActiveProfile() {
            return state.profiles.find(p => p.id === state.activeProfileId) || null;
        }

        function getActiveWashes() {
            return (state.washes[state.activeProfileId] || []).slice();
        }

        function switchToProfile(profileId) {
            if (state.activeProfileId === profileId) return;
            state.activeProfileId = profileId;
            saveState();
            render();
        }

        function deleteProfile(profileId) {
            if (state.profiles.length <= 1) {
                alert('Нельзя удалить единственный автомобиль. Добавьте ещё один профиль.');
                return;
            }
            const profile = state.profiles.find(p => p.id === profileId);
            if (!profile) return;
            if (!confirm(`Удалить профиль ${profile.brand} ${profile.model} и все его записи о мойках?`)) return;

            state.profiles = state.profiles.filter(p => p.id !== profileId);
            delete state.washes[profileId];

            if (state.activeProfileId === profileId) {
                state.activeProfileId = state.profiles[0]?.id || null;
            }
            saveState();
            render();
        }

        function deleteWash(washId) {
            const washes = state.washes[state.activeProfileId] || [];
            const card = document.querySelector(`.card[data-wash-id="${washId}"]`);
            const removeFromState = () => {
                state.washes[state.activeProfileId] = state.washes[state.activeProfileId].filter(w => w.id !== washId);
                saveState();
                render();
            };

            if (card) {
                card.classList.add('removing');
                card.addEventListener('animationend', removeFromState, { once: true });
            } else {
                removeFromState();
            }
        }

        function formatDate(dateStr, short = false) {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            const day = String(d.getDate()).padStart(2,'0');
            const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
            return short ? `${day}.${months[d.getMonth()]}.` : `${day} ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        function render() {
            const app = document.getElementById('app');
            const profile = getActiveProfile();
            if (!profile) {
                app.innerHTML = `<div style="text-align:center;padding:3rem;color:#666;">Нет профилей. Создайте первый автомобиль.</div>`;
                return;
            }

            const washes = getActiveWashes().sort((a,b) => new Date(b.date) - new Date(a.date));
            const lastWash = washes[0];
            const totalWashes = washes.length;
            const avgTime = totalWashes ? Math.round(washes.reduce((s,w) => s + (w.duration || 45), 0) / totalWashes) : '—';
            const lastThree = washes.slice(0,3).map(w => formatDate(w.date, true)).join(' · ') || '—';

            const avatarHtml = profile.avatar
                ? `<div class="avatar" style="background-image:url('${profile.avatar}')" onclick="window.triggerAvatarUpload()"></div>`
                : `<div class="avatar" onclick="window.triggerAvatarUpload()"><span style="font-size:2rem;">🚗</span></div>`;

            const accountsHtml = state.profiles.map(p => `
                <div class="account-chip ${p.id === state.activeProfileId ? 'active' : ''}" data-profile-id="${p.id}">
                    <div class="chip-avatar" style="${p.avatar ? `background-image:url('${p.avatar}')` : ''}">${p.avatar ? '' : '🚗'}</div>
                    ${p.brand}
                    <span class="chip-delete" data-delete-profile="${p.id}" title="Удалить авто">×</span>
                </div>
            `).join('') + `<button class="btn" id="addAccountBtn" style="padding:0.4rem 1.2rem;">+ Добавить</button>`;

            const galleryHtml = washes.length ? washes.map((w, i) => `
                <div class="card" style="animation-delay:${i*0.04}s" data-wash-id="${w.id}">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="color:var(--accent); font-weight:600;">📅 ${formatDate(w.date)}</span>
                        <span style="color:#aaa;">🏁 ${w.mileage?.toLocaleString() || '—'} км</span>
                        <button class="delete-btn" data-delete-wash="${w.id}">🗑️</button>
                    </div>
                    <div class="card-photo" style="${w.photo ? `background-image:url('${w.photo}')` : ''}">
                        ${!w.photo ? '📸' : ''}
                    </div>
                    <div class="notes">🧽 ${w.notes || 'Без заметок'} · ⏱️ ${w.duration || '?'} мин</div>
                </div>
            `).join('') : `<div style="color:#555; text-align:center; padding:2rem;">Записей о мойках пока нет</div>`;

            app.innerHTML = `
                <div class="profile-header anim-fade-up">
                    ${avatarHtml}
                    <div style="flex:1;">
                        <div class="car-name">${profile.brand} <span class="model">${profile.model}</span></div>
                        <div class="car-details">
                            <span>${profile.year || '—'}</span>
                            <span>Пробег: ${profile.mileage?.toLocaleString() || '—'} км</span>
                        </div>
                    </div>
                    <button class="btn" id="editProfileBtn">✎ Ред.</button>
                </div>
                <div class="account-list anim-fade-up">${accountsHtml}</div>
                <div style="display:flex; gap:1rem; align-items:center;">
                    <button class="btn primary" id="addWashBtn">➕ Новая мойка</button>
                    <span style="color:#666; font-size:0.85rem;">${lastWash ? 'Последняя: '+formatDate(lastWash.date) : 'Нет записей'}</span>
                </div>
                <div class="gallery">${galleryHtml}</div>
                <div class="stats anim-fade-up">
                    <div><div style="color:#888;">Всего моек</div><div class="stat-value">${totalWashes}</div></div>
                    <div><div style="color:#888;">Среднее время</div><div class="stat-value">${avgTime} мин</div></div>
                    <div><div style="color:#888;">Последние 3</div><div style="color:#ccc;">${lastThree}</div></div>
                </div>
                <div class="footer">🔧 Сделано своими руками · <a href="#" style="color:#555;">мойка-авто.дневник</a></div>
                <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="window.handleAvatarUpload(event)">
            `;

            // Привязка событий
            document.querySelectorAll('.account-chip').forEach(chip => {
                chip.addEventListener('click', (e) => {
                    if (e.target.classList.contains('chip-delete')) return;
                    switchToProfile(chip.dataset.profileId);
                });
            });
            document.querySelectorAll('.chip-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteProfile(btn.dataset.deleteProfile);
                });
            });
            document.getElementById('addAccountBtn')?.addEventListener('click', openAddProfileModal);
            document.getElementById('editProfileBtn')?.addEventListener('click', openEditProfileModal);
            document.getElementById('addWashBtn')?.addEventListener('click', openAddWashModal);
            document.querySelectorAll('[data-delete-wash]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteWash(Number(btn.dataset.deleteWash));
                });
            });
        }

        window.triggerAvatarUpload = () => document.getElementById('avatarInput')?.click();
        window.handleAvatarUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const profile = getActiveProfile();
                if (profile) {
                    profile.avatar = ev.target.result;
                    saveState();
                    render();
                }
            };
            reader.readAsDataURL(file);
        };

        function openModal(htmlContent) {
            document.getElementById('modalContent').innerHTML = htmlContent;
            document.getElementById('modal').classList.add('active');
        }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        function openAddWashModal() {
            openModal(`
                <h3 style="color:var(--accent);">Новая запись мойки</h3>
                <input type="date" id="wDate" value="${new Date().toISOString().slice(0,10)}">
                <input type="number" id="wMileage" placeholder="Пробег, км">
                <input type="file" id="wPhoto" accept="image/*">
                <textarea id="wNotes" placeholder="Заметки (средства, процесс)..."></textarea>
                <input type="number" id="wDuration" placeholder="Время (мин)" value="40">
                <div style="display:flex; gap:1rem; justify-content:flex-end;">
                    <button class="btn" onclick="window.closeModal()">Отмена</button>
                    <button class="btn primary" id="saveWashBtn">Сохранить</button>
                </div>
            `);
            document.getElementById('saveWashBtn').onclick = () => {
                const date = document.getElementById('wDate').value;
                const mileage = parseInt(document.getElementById('wMileage').value);
                const notes = document.getElementById('wNotes').value;
                const duration = parseInt(document.getElementById('wDuration').value) || 40;
                const photoFile = document.getElementById('wPhoto').files[0];
                const finish = (photoData) => {
                    if (!state.washes[state.activeProfileId]) state.washes[state.activeProfileId] = [];
                    state.washes[state.activeProfileId].push({
                        id: Date.now(), date, mileage: isNaN(mileage) ? null : mileage,
                        notes, duration, photo: photoData || ''
                    });
                    const profile = getActiveProfile();
                    if (profile && !isNaN(mileage)) profile.mileage = mileage;
                    saveState();
                    render();
                    closeModal();
                };
                if (photoFile) {
                    const r = new FileReader();
                    r.onload = (e) => finish(e.target.result);
                    r.readAsDataURL(photoFile);
                } else finish('');
            };
        }

        function openAddProfileModal() {
            openModal(`
                <h3>Добавить автомобиль</h3>
                <input type="text" id="pBrand" placeholder="Марка">
                <input type="text" id="pModel" placeholder="Модель">
                <input type="number" id="pYear" placeholder="Год выпуска">
                <input type="number" id="pMileage" placeholder="Пробег">
                <div style="display:flex; gap:1rem;">
                    <button class="btn" onclick="window.closeModal()">Отмена</button>
                    <button class="btn primary" id="saveProfileBtn">Создать</button>
                </div>
            `);
            document.getElementById('saveProfileBtn').onclick = () => {
                const brand = document.getElementById('pBrand').value.trim() || 'Авто';
                const model = document.getElementById('pModel').value.trim() || '';
                const year = document.getElementById('pYear').value;
                const mileage = parseInt(document.getElementById('pMileage').value) || 0;
                const newId = 'profile_' + Date.now();
                state.profiles.push({ id: newId, brand, model, year, mileage, avatar: '' });
                state.washes[newId] = [];
                state.activeProfileId = newId;
                saveState();
                render();
                closeModal();
            };
        }

        function openEditProfileModal() {
            const p = getActiveProfile();
            if (!p) return;
            openModal(`
                <h3>Редактировать профиль</h3>
                <input type="text" id="eBrand" value="${p.brand}">
                <input type="text" id="eModel" value="${p.model}">
                <input type="number" id="eYear" value="${p.year || ''}">
                <input type="number" id="eMileage" value="${p.mileage || ''}">
                <div style="display:flex; gap:1rem;">
                    <button class="btn" onclick="window.closeModal()">Отмена</button>
                    <button class="btn primary" id="saveEditBtn">Сохранить</button>
                </div>
            `);
            document.getElementById('saveEditBtn').onclick = () => {
                p.brand = document.getElementById('eBrand').value.trim() || p.brand;
                p.model = document.getElementById('eModel').value.trim() || p.model;
                p.year = document.getElementById('eYear').value;
                p.mileage = parseInt(document.getElementById('eMileage').value) || p.mileage;
                saveState();
                render();
                closeModal();
            };
        }

        window.closeModal = closeModal;
        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        });

        loadState();
        render();
    })();
</script>
</body>
</html>
